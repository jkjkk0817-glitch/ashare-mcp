name: Production keepalive (scheduled, disabled by default)

on:
  # GitHub Actions cron uses UTC. 00:40-07:40 UTC = 08:40-15:40 China time.
  # DISABLED: uncomment the two lines below when you are ready to activate.
  # schedule:
  #   - cron: "40 0-7 * * 1-5"
  # Manual dispatch is intentionally harmless: the job condition below
  # only permits scheduled events, never workflow_dispatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ashare-production-keepalive
  cancel-in-progress: false

jobs:
  warm-production-root:
    # SAFETY LOCK: hard-disabled. To activate, uncomment the schedule above
    # and remove "false &&" from the condition below. Manual dispatch stays blocked.
    if: ${{ false && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Send exactly two root requests and log timestamps, status codes, and latency
        shell: bash
        run: |
          set -uo pipefail
          URL="https://ashare-mcp-1otc.onrender.com/"

          send_request() {
            local label="$1"
            local utc_ts china_ts result curl_rc
            utc_ts="$(date -u --iso-8601=seconds)"
            china_ts="$(TZ=Asia/Shanghai date --iso-8601=seconds)"

            set +e
            result="$(curl --silent --show-error --output /dev/null \
              --write-out 'http_status=%{http_code} elapsed_seconds=%{time_total}' \
              --connect-timeout 20 --max-time 90 "$URL" 2>&1)"
            curl_rc=$?
            set -e

            if [ "$curl_rc" -eq 0 ]; then
              echo "label=$label utc_timestamp=$utc_ts china_timestamp=$china_ts $result curl_exit=0"
            else
              echo "label=$label utc_timestamp=$utc_ts china_timestamp=$china_ts $result curl_exit=$curl_rc"
            fi
          }

          echo "Target: production root URL only; no /mcp path and no data-tool calls."
          send_request "warmup_1"
          echo "Waiting approximately 3 minutes before the second request."
          sleep 180
          send_request "warmup_2"
          echo "Two-request warmup finished; no further requests will be sent by this run."
